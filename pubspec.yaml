name: fihirana
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.19

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  font_awesome_flutter: ^10.7.0
  get: ^4.7.3
  google_fonts: ^6.3.2
  flutter_secure_storage: ^9.2.2

  liquid_swipe: ^3.1.0
  flutter_zoom_drawer: ^3.2.0
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  google_sign_in: ^6.3.0
  flutter_launcher_icons: ^0.14.4
  cached_network_image: ^3.4.1
  local_auth: ^3.0.0
  android_intent_plus: ^6.0.0
  path_provider: ^2.1.5
  dots_indicator: ^4.0.1
  flutter_svg: ^2.2.3
  flutter_colorpicker: ^1.1.0
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  loading_animation_widget: ^1.2.1
  intl: ^0.20.2
  flutter_phoenix: ^1.1.1
  awesome_notifications: ^0.10.1
  syncfusion_flutter_sliders: ^31.2.15
  in_app_update: ^4.2.5
  flutter_neumorphic_plus: ^3.3.0
  open_file: ^3.5.0
  permission_handler: ^12.0.1
  dio: ^5.7.0
  just_audio: ^0.10.5
  simple_gesture_detector: ^0.2.1
  path: ^1.9.0
  share_plus: ^12.0.1
  rive: ^0.13.13
  flutter_animate: ^4.5.2
  file_picker: ^10.3.7
  app_links: ^6.4.1
  collection: ^1.19.1
  record: ^6.1.2
  googleapis: ^15.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  googleapis_auth: ^2.0.0
  uuid: ^4.5.2
  debounce_throttle: ^2.0.0
  maplibre_gl: ^0.22.0
  flutter_contacts: ^1.1.9
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Add assets from images directory to the application.
    - assets/images/

    - assets/json/
    - assets/baiboly/
    - assets/animations/
    - assets/hymn_manifest.json
    - assets/hymns_combined.json
    - pubspec.yaml

  # Optimized font set - reduced from 125+ files to essential fonts only
  fonts:
    # Primary fonts (heavily used)
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    
    # Secondary fonts (used in font controller)
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    
    # Special purpose fonts
    - family: Hack
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
        - asset: assets/fonts/Hack-Bold.ttf
          weight: 700
    - family: GoBold
      fonts:
        - asset: assets/fonts/GoBold-Bold.otf
          weight: 700
        - asset: assets/fonts/GoBold-Light.otf
          weight: 300
    
    # Educational fonts (keep one representative)
    - family: EduNSWACTFoundation
      fonts:
        - asset: assets/fonts/EduNSWACTFoundation-Regular.ttf
        - asset: assets/fonts/EduNSWACTFoundation-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path_android: "assets/images/icon.png"
  image_path_ios: "assets/images/icon.png"
  android: true # can specify file name here e.g. "ic_launcher"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  adaptive_icon_background: "assets/images/icon.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/images/icon.png" # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/images/icon.png" # only available for Android 13 devices and above
  min_sdk_android: 23 # android min sdk min:16, default 21
  remove_alpha_ios: true
  background_color_ios: "#ffffff"