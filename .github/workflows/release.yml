name: Create Release

on:
  push:
    branches:
      - 'master'
      - 'develop'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # Checkout code
      # ----------------------
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ----------------------
      # Free up disk space
      # ----------------------
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

# ----------------------
      # Set up Java (for Android build)
      # ----------------------
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ----------------------
      # Cache Gradle dependencies
      # ----------------------
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ----------------------
      # Set up Flutter
      # ----------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      # ----------------------
      # Check Flutter version
      # ----------------------
      - name: Flutter version
        run: flutter --version

      # ----------------------
      # Install dependencies
      # ----------------------
      - name: Get dependencies
        run: flutter pub get

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      # ----------------------
      # Check & Update Version
      # ----------------------
      - name: Check & Update Version
        run: |
          dart tool/update_version.dart check-update
          
          # Extract version for release name
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "App Version: $VERSION"

      # ----------------------
      # Generate App Icons
      # ----------------------
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons:main

      # ----------------------
      # Generate Asset Manifest
      # ----------------------
      - name: Generate Asset Manifest
        run: |
          echo "Regenerating dependencies after manifest creation..."
          flutter pub get

       # ----------------------
       # Generate Code (build_runner)
       # ----------------------
      - name: Generate Code
        run: |
           echo "Generating code with build_runner..."
           flutter pub run build_runner build --delete-conflicting-outputs
           echo "✅ Code generation completed"

       # ----------------------
       # Verify assets
       # ----------------------
      - name: Verify assets
        run: |
           echo "Checking assets directory..."
           ls -la assets/json/ | head -10
           echo "Total JSON files: $(find assets/json -name "*.json" | wc -l)"
           echo "Generated manifest:"
           cat assets/hymn_manifest.json | head -20
           echo "Sample JSON files:"
           ls assets/json/*.json | head -5

      # ----------------------
      # Setup Keystore
      # ----------------------
      - name: Setup Keystore
        run: |
          echo "Setting up Keystore..."
          python -c "import base64; open('android/app/fihirana.jks','wb').write(base64.b64decode('${{ secrets.KEYSTORE_BASE64 }}'))"
          if [ ! -f "android/app/fihirana.jks" ]; then
            echo '❌ Keystore file was not created'
            exit 1
          fi
          echo "✅ Keystore created successfully"
          ls -l android/app/fihirana.jks
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

      # ----------------------
      # Verify Required Secrets
      # ----------------------
      - name: Verify Required Secrets
        run: |
          echo "Verifying required secrets are available..."
          
          # Check if required secrets exist
          if [ -z "${{ secrets.GOOGLE_JSON_BASE64 }}" ]; then
            echo "❌ GOOGLE_JSON_BASE64 secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "❌ KEY_ALIAS secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "❌ KEY_PASSWORD secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_STORE_PASSWORD }}" ]; then
            echo "❌ KEY_STORE_PASSWORD secret is missing"
            exit 1
          fi
          
          echo "✅ All required secrets are available"

      # ----------------------
      # Setup Google Services JSON (Firebase)
      # ----------------------
      - name: Setup Google Services JSON
        shell: bash
        run: |
          echo "Decoding google-services.json..."
          mkdir -p android/app android/app/src/release

          # Decode the base64 secret safely into both paths
          echo "${{ secrets.GOOGLE_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          cp android/app/google-services.json android/app/src/release/google-services.json

          echo "✅ google-services.json created:"
          ls -l android/app/google-services.json
          ls -l android/app/src/release/google-services.json

          echo "Contents (truncated):"
          head -n 5 android/app/google-services.json

      # ----------------------
      # Verify google-services.json presence
      # ----------------------
      - name: Verify google-services.json before build
        run: |
          echo "Verifying google-services.json before build..."
          find android/app -name "google-services.json" -print
          if [ ! -f "android/app/google-services.json" ]; then
            echo "❌ google-services.json not found in android/app"
            exit 1
          fi
          if [ ! -f "android/app/src/release/google-services.json" ]; then
            echo "❌ google-services.json not found in android/app/src/release"
            exit 1
          fi
          echo "✅ google-services.json verified"

      # ----------------------
      # Generate Changelog
      # ----------------------
      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"* %s" > CHANGELOG.md
          else
            git log --pretty=format:"* %s" $PREVIOUS_TAG..HEAD > CHANGELOG.md
          fi
          echo "CHANGELOG created:"
          cat CHANGELOG.md

# ----------------------
      # Build Flutter APKs
      # ----------------------
      - name: Build APKs
        working-directory: .
        run: |
          echo "Building APKs for all architectures..."
          
          # Build APK for all architectures (arm64-v8a, armeabi-v7a, x86_64)
          flutter build apk --release --split-per-abi
          
          # Build universal APK
          flutter build apk --release
          
          echo "APKs built successfully"
          ls -la build/app/outputs/flutter-apk/
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

      # ----------------------
      # Rename APKs to Fihirana-JFF
      # ----------------------
      - name: Rename APKs
        run: |
          echo "Renaming APKs to Fihirana-JFF..."
          cd build/app/outputs/flutter-apk/
          
          # Rename architecture-specific APKs
          if [ -f "app-arm64-v8a-release.apk" ]; then
            mv "app-arm64-v8a-release.apk" "Fihirana-JFF-arm64-v8a.apk"
          fi
          if [ -f "app-armeabi-v7a-release.apk" ]; then
            mv "app-armeabi-v7a-release.apk" "Fihirana-JFF-armeabi-v7a.apk"
          fi
          if [ -f "app-x86_64-release.apk" ]; then
            mv "app-x86_64-release.apk" "Fihirana-JFF-x86_64.apk"
          fi
          
          # Rename universal APK
          if [ -f "app-release.apk" ]; then
            mv "app-release.apk" "Fihirana-JFF-universal.apk"
          fi
          
          echo "Renamed APKs:"
          ls -la *.apk

      # ----------------------
      # Create GitHub Release
      # ----------------------
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/Fihirana-JFF*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.APP_VERSION }}
          name: fihirana+${{ env.APP_VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------
      # Commit Version Changes
      # ----------------------
      - name: Commit Version Changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Add specific files we want to track
          git add pubspec.yaml android/app/build.gradle.kts
          
          # Check if there are staged changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to ${{ env.APP_VERSION }} [skip ci]"
            git push
          else
            echo "No version changes to commit."
          fi
