name: Flutter CI/CD

on:
  pull_request:
    branches: [ "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------
      # Free up disk space
      # ----------------------
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ----------------------
      # Set up Java
      # ----------------------
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ----------------------
      # Cache Gradle dependencies
      # ----------------------
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      # ----------------------
      # Generate App Icons
      # ----------------------
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons:main

      # ----------------------
      # Generate Asset Manifest
      # ----------------------
      - name: Generate Asset Manifest
        run: |
          echo "Regenerating dependencies after manifest creation..."
          flutter pub get

       # ----------------------
       # Generate Code (build_runner)
       # ----------------------
      - name: Generate Code
        run: |
           echo "Generating code with build_runner..."
           flutter pub run build_runner build --delete-conflicting-outputs
           echo "✅ Code generation completed"

       # ----------------------
       # Verify assets
       # ----------------------
      - name: Verify assets
        run: |
           echo "Checking assets directory..."
           ls -la assets/json/ | head -10
           echo "Total JSON files: $(find assets/json -name "*.json" | wc -l)"
           echo "Generated manifest:"
           cat assets/hymn_manifest.json | head -20
           echo "Sample JSON files:"
           ls assets/json/*.json | head -5

      # ----------------------
      # Verify Required Secrets
      # ----------------------
      - name: Verify Required Secrets
        run: |
          echo "Verifying required secrets are available..."
          
          # Check if required secrets exist
          if [ -z "${{ secrets.GOOGLE_JSON_BASE64 }}" ]; then
            echo "❌ GOOGLE_JSON_BASE64 secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "❌ KEY_ALIAS secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "❌ KEY_PASSWORD secret is missing"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_STORE_PASSWORD }}" ]; then
            echo "❌ KEY_STORE_PASSWORD secret is missing"
            exit 1
          fi
          
          echo "✅ All required secrets are available"

      # ----------------------
      # Setup Google Services JSON (Firebase)
      # ----------------------
      - name: Setup Google Services JSON
        shell: bash
        run: |
          echo "Decoding google-services.json..."
          mkdir -p android/app android/app/src/release

          # Decode the base64 secret safely into both paths
          echo "${{ secrets.GOOGLE_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          cp android/app/google-services.json android/app/src/release/google-services.json

          echo "✅ google-services.json created:"
          ls -l android/app/google-services.json
          ls -l android/app/src/release/google-services.json

      # ----------------------
      # Setup Keystore
      # ----------------------
      - name: Setup Keystore
        run: |
          echo "Setting up Keystore..."
          python -c "import base64; open('android/app/fihirana.jks','wb').write(base64.b64decode('${{ secrets.KEYSTORE_BASE64 }}'))"
          if [ ! -f "android/app/fihirana.jks" ]; then
            echo '❌ Keystore file was not created'
            exit 1
          fi
          echo "✅ Keystore created successfully"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

      # ----------------------
      # Build APKs (Check only)
      # ----------------------
      - name: Build APKs
        run: |
          echo "Building APKs for verification..."
          flutter build apk --release --split-per-abi
          flutter build apk --release
          echo "APKs built successfully"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}