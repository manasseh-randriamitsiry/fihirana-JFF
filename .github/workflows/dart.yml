name: Flutter CI/CD

on:
  push:
    branches: [ "master", "beta" ]
  pull_request:
    branches: [ "master", "beta" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches

      # ----------------------
      # Set up Java (for Android build)
      # ----------------------
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # ----------------------
      # Cache Gradle dependencies
      # ----------------------
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      # ----------------------
      # Generate App Icons
      # ----------------------
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons:main

      # ----------------------
      # Generate Asset Manifest
      # ----------------------
      - name: Generate Asset Manifest
        run: |
          echo "Generating custom hymn asset manifest..."
          dart run tool/generate_assets.dart
          echo "Regenerating dependencies after manifest creation..."
          flutter pub get

      # ----------------------
      # Verify assets
      # ----------------------
      - name: Verify assets
        run: |
          echo "Checking assets directory..."
          ls -la assets/json/ | head -10
          echo "Total JSON files: $(find assets/json -name "*.json" | wc -l)"
          echo "Generated manifest:"
          cat assets/hymn_manifest.json | head -20
          echo "Sample JSON files:"
          ls assets/json/*.json | head -5

      # ----------------------
      # Setup Google Services JSON (Firebase)
      # ----------------------
      - name: Setup Google Services JSON
        shell: bash
        run: |
          echo "Decoding google-services.json..."
          mkdir -p android/app android/app/src/release

          # Decode the base64 secret safely into both paths
          echo "${{ secrets.GOOGLE_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          cp android/app/google-services.json android/app/src/release/google-services.json

          echo "✅ google-services.json created:"
          ls -l android/app/google-services.json
          ls -l android/app/src/release/google-services.json

      # ----------------------
      # Setup Keystore
      # ----------------------
      - name: Setup Keystore
        run: |
          echo "Setting up Keystore..."
          python -c "import base64; open('android/app/fihirana.jks','wb').write(base64.b64decode('${{ secrets.KEYSTORE_BASE64 }}'))"
          if [ ! -f "android/app/fihirana.jks" ]; then
            echo '❌ Keystore file was not created'
            exit 1
          fi
          echo "✅ Keystore created successfully"

      # ----------------------
      # Build APK
      # ----------------------
      - name: Build APK
        run: flutter build apk --release

      # ----------------------
      # Verify APK contents
      # ----------------------
      - name: Check APK contents
        run: |
          echo "Checking APK contents for assets..."
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -i "assets" | head -20
          echo "Checking for hymn manifest in APK:"
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep "hymn_manifest.json" || echo "Hymn manifest not found in APK"
          echo "Total JSON files in APK: $(unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -c "assets/json.*\.json" || echo "0")"

      # Create GitHub Release
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload APK to the release
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive